<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | Aurora Moda Femenina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="cabecera-pagina">
      <h1>Tienda</h1>
      <p>Todo el catálogo Aurora en un solo lugar.</p>
    </div>

    <section class="tienda">
      <div class="herramientas">
        <input type="search" id="buscar" placeholder="Buscar prenda…" aria-label="Buscar prenda">
        <select id="orden" aria-label="Ordenar">
          <option value="rel">Más relevantes</option>
          <option value="menor">Precio: menor a mayor</option>
          <option value="mayor">Precio: mayor a menor</option>
          <option value="az">Nombre: A–Z</option>
        </select>
        <label class="rango">Hasta <b id="precio-txt"></b>
          <input type="range" id="precio" min="40000" max="300000" step="10000" value="300000">
        </label>
      </div>

      <div class="filtros" id="filtros"></div>
      <p class="resultados" id="resultados"></p>
      <div class="galeria" id="catalogo"></div>
      <p class="vacio-tienda" id="vacio" hidden>No encontramos prendas con esos filtros. Prueba con otra categoría o borra la búsqueda.</p>
    </section>
  </main>

  <div id="footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
